<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barcode Scanner</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f9fb;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #333;
    }
    video {
      width: 100%;
      max-width: 420px;
      border: 3px solid #444;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    #result {
      margin-top: 15px;
      font-size: 1.3em;
      font-weight: bold;
      color: #2b9348;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1em;
      background: #0077cc;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #005fa3;
    }
  </style>
</head>
<body>
  <h1>📷 Barcode Scanner</h1>
  <video id="video" autoplay playsinline></video>
  <div id="result">Initializing camera...</div>
  <button id="restart" style="display:none;">Scan Again</button>

  <!-- ZXing library (ES module build) -->
  <script type="module">
    import { BrowserMultiFormatReader } from 'https://cdn.jsdelivr.net/npm/@zxing/library@latest/esm/index.min.js';

    const video = document.getElementById('video');
    const result = document.getElementById('result');
    const restartBtn = document.getElementById('restart');
    const codeReader = new BrowserMultiFormatReader();

    let scanning = true;

    async function startScanner() {
      result.textContent = '📸 Accessing camera...';
      try {
        const devices = await codeReader.listVideoInputDevices();
        if (devices.length === 0) {
          result.textContent = '❌ No camera found';
          return;
        }

        const deviceId = devices[0].deviceId; // use first camera
        result.textContent = '🟢 Point your camera at a barcode...';

        codeReader.decodeFromVideoDevice(deviceId, video, (decoded, err) => {
          if (decoded && scanning) {
            scanning = false;
            const code = decoded.text;
            result.textContent = `✅ Scanned: ${code}`;
            codeReader.reset();
            restartBtn.style.display = 'inline-block';

            // Example: handle scanned data
            handleScan(code);
          }
        });
      } catch (error) {
        console.error(error);
        result.textContent = '⚠️ Error accessing camera.';
      }
    }

    // Handle scanned result (you can customize this)
    async function handleScan(code) {
      console.log('Scanned:', code);
      // For example, show an alert or send to backend:
      // await fetch('/api/scan', { method:'POST', body: JSON.stringify({ code }) });
      alert(`Scanned barcode:\n${code}`);
    }

    restartBtn.addEventListener('click', () => {
      restartBtn.style.display = 'none';
      scanning = true;
      startScanner();
    });

    // Start camera on page load
    startScanner();
  </script>
</body>
</html>
