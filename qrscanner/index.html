<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZXing Barcode Scanner</title>
</head>
<body>
  <h2>📷 ZXing Barcode Scanner</h2>
  <video id="video" style="width:100%;max-width:400px;" autoplay playsinline></video>
  <p id="result">Initializing camera...</p>
  <button id="restart" style="display:none;">Scan Again</button>

  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
  <script>
    const codeReader = new ZXing.BrowserMultiFormatReader();
    const video = document.getElementById('video');
    const result = document.getElementById('result');
    const restartBtn = document.getElementById('restart');
    let stream;
    let scanning = true;

    async function startScanner() {
      result.textContent = "📸 Requesting camera access...";

      try {
        // Stop any existing stream before starting a new one
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }

        // Prefer the back camera
        const constraints = {
          audio: false,
          video: { facingMode: { ideal: "environment" } }
        };

        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        video.play();

        result.textContent = "🟢 Point your camera at a barcode...";

        codeReader.decodeFromVideoDevice(null, video, (decoded, err) => {
          if (decoded && scanning) {
            scanning = false;
            const code = decoded.text;
            result.textContent = `✅ Scanned: ${code}`;
            codeReader.reset();
            alert("Scanned: " + code);
            restartBtn.style.display = "inline-block";
          }
        });

      } catch (error) {
        console.error("Camera access error:", error);
        result.textContent = "⚠️ Error accessing camera. Make sure permissions are granted and use HTTPS.";
      }
    }

    restartBtn.addEventListener('click', () => {
      restartBtn.style.display = "none";
      scanning = true;
      startScanner();
    });

    startScanner();
  </script>
</body>
</html>
