<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<script>
  const codeReader = new ZXing.BrowserMultiFormatReader();
  const video = document.getElementById('video');
  const result = document.getElementById('result');
  const restartBtn = document.getElementById('restart');
  let scanning = true;
  let currentDeviceId = null;

  async function startScanner() {
    result.textContent = "📸 Accessing back camera...";

    try {
      // List all video input devices
      const devices = await codeReader.listVideoInputDevices();

      // Find back camera if available
      const backCamera = devices.find(device =>
        device.label.toLowerCase().includes('back')
      );

      // Choose back camera if found, otherwise use first device
      currentDeviceId = backCamera ? backCamera.deviceId : devices[0]?.deviceId;

      if (!currentDeviceId) {
        result.textContent = "❌ No camera found.";
        return;
      }

      result.textContent = "🟢 Point your back camera at a barcode...";

      // Force the environment camera on iOS
      const constraints = {
        video: {
          facingMode: { exact: "environment" },
          deviceId: currentDeviceId ? { exact: currentDeviceId } : undefined
        }
      };

      // Stop any previous stream
      codeReader.reset();

      // Manually start camera stream (to enforce constraints)
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      video.play();

      // Decode from that stream
      codeReader.decodeFromVideoDevice(currentDeviceId, video, (decoded, err) => {
        if (decoded && scanning) {
          scanning = false;
          const code = decoded.text;
          result.textContent = `✅ Scanned: ${code}`;
          codeReader.reset();
          restartBtn.style.display = "inline-block";
          alert("Scanned: " + code);
        }
      });

    } catch (error) {
      console.error(error);
      result.textContent = "⚠️ Error accessing camera.";
    }
  }

  restartBtn.addEventListener('click', () => {
    restartBtn.style.display = "none";
    scanning = true;
    startScanner();
  });

  startScanner();
</script>
